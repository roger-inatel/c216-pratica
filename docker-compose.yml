name: c216-pratica

services:
  db:
    image: postgres:16-alpine
    # STACK_NAME so muda no make e2e, que sobe uma pilha separada para os testes.
    container_name: ${STACK_NAME:-c216}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c216}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c216}
      POSTGRES_DB: ${POSTGRES_DB:-c216}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-c216} -d ${POSTGRES_DB:-c216}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - c216-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-c216}-backend
    restart: unless-stopped
    environment:
      # Dentro da rede do Compose o banco responde pelo nome do servico;
      # "localhost" aqui seria o proprio container do backend.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-c216}:${POSTGRES_PASSWORD:-c216}@db:5432/${POSTGRES_DB:-c216}
      # Endereco do frontend como o navegador enxerga. Se mudar FRONTEND_PORT, mude aqui.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    # Só sobe depois que o Postgres responde ao pg_isready, e nao apenas
    # depois que o container do banco existe.
    depends_on:
      db:
        condition: service_healthy
    # Aplica as migrations pendentes antes de servir: quem sobe o projeto
    # encontra a API ja respondendo sobre a estrutura correta.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - c216-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Quem chama a API e o navegador, fora da rede do Compose: por isso a URL
        # usa a porta publicada no host, e nao o nome do servico "backend".
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: ${STACK_NAME:-c216}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - c216-net

volumes:
  pgdata:

networks:
  c216-net:
    driver: bridge
