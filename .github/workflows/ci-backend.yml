name: CI - Backend

on:
  push:
  pull_request:

permissions:
  contents: read

# Os nomes dos jobs sao os checks exigidos pelo ruleset das branches aulas e main.
jobs:
  lint-and-format:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      # Antes do setup-python, que usa o Poetry para montar o cache.
      - name: Instalar Poetry
        run: pipx install poetry==2.1.4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instalar dependencias com Poetry
        run: poetry install

      - name: Conferir formatacao
        run: poetry run ruff format --check .

      - name: Conferir lint
        run: poetry run ruff check .

  tests:
    name: Pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Sem TEST_DATABASE_URL a suite roda em SQLite na memoria. Aqui ela roda contra
    # a mesma versao do Postgres que o Compose usa.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c216
          POSTGRES_PASSWORD: c216
          POSTGRES_DB: c216
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c216 -d c216"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar Poetry
        run: pipx install poetry==2.1.4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instalar dependencias com Poetry
        run: poetry install

      - name: Mostrar versoes
        run: |
          poetry --version
          poetry run python --version
          poetry run python -c "import sqlalchemy; print(sqlalchemy.create_engine('$TEST_DATABASE_URL').dialect.name)"

      - name: Executar Pytest
        run: poetry run pytest -v
