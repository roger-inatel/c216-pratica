name: CI - Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

# O nome do job e o check exigido pelo ruleset das branches aulas e main.
jobs:
  frontend:
    name: Frontend (Biome, Vitest, Build & Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Mostrar versoes
        run: |
          node --version
          npm --version
          npx biome --version

      - name: Conferir lint
        run: npm run lint

      - name: Conferir formatacao
        run: npm run format:check

      - name: Executar testes unitarios e de integracao
        run: npm run test

      - name: Gerar build de producao
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Publicar relatorio do Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
